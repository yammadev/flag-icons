<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>flag-icons · 264 svg + png + css flags</title>
  <meta name="description" content="A beautiful svg + png + sass + css collection of 264 flags.">
  <link rel="icon" href="svg/CO.svg">
  <link rel="stylesheet" href="css/flag-icons.min.css">
  <style>
    :root {
      --bg: #f6f5f2; --card: #fff; --ink: #1d1f23; --muted: #6b6f76; --line: #e4e2dc; --accent: #1f6feb;
      color-scheme: light dark;
    }
    @media (prefers-color-scheme: dark) {
      :root { --bg: #141518; --card: #1d1f23; --ink: #eceae4; --muted: #9a9ea6; --line: #2d3036; --accent: #6ea8ff; }
    }
    * { box-sizing: border-box; }
    body { margin: 0; background: var(--bg); color: var(--ink); font: 15px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif; }
    header { max-width: 1100px; margin: 0 auto; padding: 48px 16px 24px; }
    h1 { margin: 0 0 6px; font-size: clamp(28px, 5vw, 44px); letter-spacing: -0.02em; display: flex; gap: 12px; align-items: center; }
    h1 .flag-icons { font-size: 0.8em; border-radius: 3px; }
    header p { margin: 0 0 20px; color: var(--muted); }
    pre { margin: 0 0 8px; padding: 12px 14px; background: var(--card); border: 1px solid var(--line); border-radius: 8px; overflow-x: auto; font-size: 13px; }
    .links a { color: var(--accent); margin-right: 16px; }
    .toolbar { position: sticky; top: 0; z-index: 1; background: var(--bg); border-bottom: 1px solid var(--line); }
    .toolbar > div { max-width: 1100px; margin: 0 auto; padding: 12px 16px; display: flex; flex-wrap: wrap; gap: 12px 20px; align-items: center; }
    input[type=search] { flex: 1 1 240px; min-width: 0; padding: 10px 12px; border: 1px solid var(--line); border-radius: 8px; background: var(--card); color: var(--ink); font: inherit; }
    label { color: var(--muted); display: inline-flex; gap: 6px; align-items: center; }
    main { max-width: 1100px; margin: 0 auto; padding: 20px 16px 64px; }
    h2 { font-size: 13px; text-transform: uppercase; letter-spacing: 0.08em; color: var(--muted); margin: 24px 0 12px; }
    .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 10px; }
    button.flag { all: unset; cursor: pointer; background: var(--card); border: 1px solid var(--line); border-radius: 10px; padding: 14px 12px; display: grid; gap: 8px; justify-items: start; }
    button.flag:hover, button.flag:focus-visible { border-color: var(--accent); }
    button.flag .flag-icons { font-size: var(--size, 28px); box-shadow: 0 0 0 1px rgb(0 0 0 / 8%); border-radius: 2px; }
    button.flag code { font-size: 12px; color: var(--accent); }
    button.flag span.name { font-size: 13px; line-height: 1.3; }
    .empty { color: var(--muted); }
    .toast { position: fixed; left: 50%; bottom: 24px; transform: translateX(-50%); background: var(--ink); color: var(--bg); padding: 8px 14px; border-radius: 8px; font-size: 13px; opacity: 0; transition: opacity .2s; pointer-events: none; }
    .toast.show { opacity: 1; }
  </style>
</head>
<body>
  <header>
    <h1><i class="flag-icons CO"></i> flag-icons</h1>
    <p>A beautiful svg + png + sass + css collection of <strong id="total">264</strong> flags. Click a flag to copy its markup.</p>
    <pre><code>&lt;link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/yammadev/flag-icons@3.1.0/css/flag-icons.min.css"&gt;

&lt;i class="flag-icons CO"&gt;&lt;/i&gt;</code></pre>
    <div class="links"><a href="https://github.com/yammadev/flag-icons">GitHub</a><a href="https://github.com/yammadev/flag-icons#readme">Docs</a><a href="https://www.npmjs.com/package/@yammadev/flag-icons">npm</a></div>
  </header>

  <div class="toolbar"><div>
    <input id="q" type="search" placeholder="Search by name or code…" autocomplete="off" aria-label="Search flags">
    <label><input id="square" type="checkbox"> square</label>
    <label><input id="fill" type="checkbox"> fill</label>
    <label>size <input id="size" type="range" min="16" max="64" value="28"></label>
  </div></div>

  <main id="list"></main>
  <div class="toast" id="toast" role="status"></div>

  <script>
    const $ = (id) => document.getElementById(id);
    let data = { extras: [], countries: [] };

    function render() {
      const q = $('q').value.trim().toLowerCase();
      const mods = ['flag-icons', $('square').checked && 'square', $('fill').checked && 'fill'].filter(Boolean).join(' ');
      document.documentElement.style.setProperty('--size', $('size').value + 'px');
      const match = (f) => !q || f.code.toLowerCase().includes(q) || f.name.toLowerCase().includes(q);
      const section = (title, list) => {
        const items = list.filter(match);
        if (!items.length) return '';
        return `<h2>${title} · ${items.length}</h2><div class="grid">${items.map((f) =>
          `<button class="flag" data-code="${f.code}" title="Copy markup"><i class="${mods} ${f.code}"></i><code>${f.code}</code><span class="name">${f.name}</span></button>`
        ).join('')}</div>`;
      };
      const html = section('Countries', data.countries) + section('Extras', data.extras);
      $('list').innerHTML = html || '<p class="empty">No flags match your search.</p>';
    }

    $('list').addEventListener('click', async (e) => {
      const btn = e.target.closest('button.flag');
      if (!btn) return;
      const markup = btn.querySelector('i').outerHTML;
      try { await navigator.clipboard.writeText(markup); toast('Copied ' + markup); }
      catch { toast(markup); }
    });

    let timer;
    function toast(text) {
      $('toast').textContent = text;
      $('toast').classList.add('show');
      clearTimeout(timer);
      timer = setTimeout(() => $('toast').classList.remove('show'), 1600);
    }

    ['q', 'square', 'fill', 'size'].forEach((id) => $(id).addEventListener('input', render));

    fetch('flags.json').then((r) => r.json()).then((json) => {
      data = json;
      $('total').textContent = json.extras.length + json.countries.length;
      render();
    });
  </script>
</body>
</html>
